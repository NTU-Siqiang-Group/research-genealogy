name: Bug report
description: Report reproducible incorrect behavior in the pipeline or interface.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Research Genealogy. Do not include API keys, PDFs, or private result bundles.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For example, v0.2.0 or a Git commit SHA.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Corpus discovery
        - Full-text retrieval
        - Evidence extraction
        - Graph inference
        - Web interface
        - Installation or configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence and sanitized inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, provider, and relevant non-secret settings.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Redact credentials, local paths, unpublished data, and copyrighted PDFs.

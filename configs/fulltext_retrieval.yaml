# Full-text discovery is independent of corpus discovery. OpenAlex URLs are
# tried first; these sources are fallbacks for records whose pdf_url is absent
# or invalid.
author_pages:
  - https://siqiangluo.com/publication

# After deterministic OpenAlex/DOI/arXiv/DBLP fallbacks fail, use an optional
# OpenAI, DeepSeek, or compatible hosted web-search provider to discover pages
# belonging to first and corresponding authors. If corresponding metadata is
# absent, the last author is retained as an explicitly marked proxy.
auto_author_homepages: true
author_search_timeout_seconds: 90

use_doi: true
use_arxiv: true
use_dblp: true

# Optional project overrides can be keyed by canonical paper ID or title.
# They are still downloaded and title-validated before acceptance.
overrides:
  OPENALEX:W4399175309: https://siqiangluo.com/docs/moose_corrected_version.pdf

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-genealogy"
version = "0.2.0"
description = "Build an evidence-backed research lineage from a seed paper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "openai>=3.3.1"]
keywords = [
    "academic-literature",
    "citation-analysis",
    "knowledge-graph",
    "openalex",
    "research-genealogy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/NTU-Siqiang-Group/research-genealogy"
Repository = "https://github.com/NTU-Siqiang-Group/research-genealogy.git"
Issues = "https://github.com/NTU-Siqiang-Group/research-genealogy/issues"
Changelog = "https://github.com/NTU-Siqiang-Group/research-genealogy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
